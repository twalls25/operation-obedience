<svg viewBox="0 130 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="560" fill="#17191c"/>

  <!-- ===== LINE 1: OPERATION ===== baseline y1=260, cap top=190, charWidth=66, startX=303 -->
  <g font-family="Courier New, monospace" font-weight="700" font-size="88" fill="#f2f0eb" text-anchor="middle">
    <!-- letter 0: O -> reticle, drawn separately below -->
    <text x="402" y="260">P</text>
    <text x="468" y="260">E</text>
    <text x="534" y="260">R</text>
    <text x="600" y="260">A</text>
    <!-- letter 5: T -> sword (drawn separately, spans into line 2) -->
    <text x="732" y="260">I</text>
    <text x="798" y="260">O</text>
    <text x="864" y="260">N</text>
  </g>

  <!-- Reticle O, center (336,225) -->
  <g stroke="#e2691f" fill="none">
    <circle cx="336" cy="225" r="32" stroke-width="4"/>
    <!-- outer crosshair ticks -->
    <line x1="336" y1="178" x2="336" y2="193" stroke-width="4"/>
    <line x1="336" y1="257" x2="336" y2="272" stroke-width="4"/>
    <line x1="284" y1="225" x2="299" y2="225" stroke-width="4"/>
    <line x1="373" y1="225" x2="388" y2="225" stroke-width="4"/>
    <!-- crosshair lines through circle -->
    <line x1="336" y1="196" x2="336" y2="254" stroke-width="2.5"/>
    <line x1="307" y1="225" x2="365" y2="225" stroke-width="2.5"/>
    <!-- mil-dot ranging ticks -->
    <line x1="326" y1="208" x2="346" y2="208" stroke-width="2"/>
    <line x1="326" y1="242" x2="346" y2="242" stroke-width="2"/>
    <line x1="319" y1="216" x2="319" y2="234" stroke-width="2"/>
    <line x1="353" y1="216" x2="353" y2="234" stroke-width="2"/>
    <!-- center dot -->
    <circle cx="336" cy="225" r="3" fill="#e2691f" stroke="none"/>
  </g>

  <!-- ===== LINE 2: OBEDIENCE ===== baseline y2=400, cap top=330, startX shifted +66 = 369 -->
  <g font-family="Courier New, monospace" font-weight="700" font-size="88" fill="#f2f0eb" text-anchor="middle">
    <text x="402" y="400">O</text>
    <text x="468" y="400">B</text>
    <text x="534" y="400">E</text>
    <text x="600" y="400">D</text>
    <!-- letter I (index4, x=666) -> sword blade continues here, drawn separately -->
    <text x="732" y="400">E</text>
    <text x="798" y="400">N</text>
    <text x="864" y="400">C</text>
    <text x="930" y="400">E</text>
  </g>

  <!-- ===== UNIFIED SWORD: T (line1) + I (line2), one continuous piece at x=666 ===== -->
  <g fill="#e2691f" stroke="none">
    <!-- pommel -->
    <path d="M 656 162 Q 666 152 676 162 L 673 172 L 659 172 Z"/>
    <!-- grip -->
    <rect x="659" y="172" width="14" height="18" rx="2"/>
    <!-- crossguard, tapered flare wider than letter cell -->
    <path d="M 628 190 L 704 190 L 696 202 L 636 202 Z"/>
    <!-- lower grip continuing as visual stem into blade shoulder -->
    <rect x="660" y="202" width="12" height="20"/>
    <!-- blade shoulder / start -->
    <path d="M 654 222 L 678 222 L 672 260 L 660 260 Z"/>
    <!-- blade tapering down through line 2, ending in a point past baseline -->
    <path d="M 660 260 L 672 260 L 668 400 L 666 415 L 664 400 Z"/>
  </g>
  <!-- grip wrap texture -->
  <g stroke="#17191c" stroke-width="2.5">
    <line x1="659" y1="178" x2="673" y2="178"/>
    <line x1="659" y1="184" x2="673" y2="184"/>
  </g>
  <!-- blade center fuller line -->
  <line x1="666" y1="228" x2="666" y2="405" stroke="#17191c" stroke-width="2"/>
</svg>
